app = "soft-comptabilite"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

# Indispensable : sans ce volume, la base est effacee a chaque redéploiement.
# Créez-le UNE SEULE FOIS :  fly volumes create compta_data --size 1 --region cdg
[mounts]
  source = "compta_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # L'application se met en veille quand personne ne l'utilise, pour rester
  # dans l'offre gratuite. Le premier chargement après une veille peut donc
  # prendre 1 a 3 secondes.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # 0 = la machine s'eteint vraiment. Mettez 1 si vous preferez une reponse
  # instantanee, au prix d'une machine allumee en permanence.
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/sante"

# Les secrets (ADMIN_PASSWORD) : fly secrets set ADMIN_PASSWORD=...
# NE les mettez JAMAIS dans ce fichier.

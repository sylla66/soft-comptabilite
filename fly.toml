app = "comptabilite-poisson"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

# Indispensable : sans ce volume, la base est effacee a chaque redéploiement.
# Créez-le UNE SEULE FOIS :  fly volumes create compta_data --size 1 --region cdg
[mounts]
  source = "compta_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/sante"

# Les secrets (ADMIN_PASSWORD) : fly secrets set ADMIN_PASSWORD=...
# NE les mettez JAMAIS dans ce fichier.
